{{- if .Values.devicePlugin.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: generic-device-plugin
  namespace: kube-system
  labels:
    {{- include "neural-gate.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: generic-device-plugin
  template:
    metadata:
      labels:
        app: generic-device-plugin
    spec:
      containers:
      - name: generic-device-plugin
        image: {{ .Values.devicePlugin.image }}
        args:
        - --device
        - |
          name: dri
          groups:
            - paths:
                - path: /dev/dri/card0
                - path: /dev/dri/renderD128
              count: {{ .Values.devicePlugin.dri.count }}
        securityContext:
          privileged: true
        volumeMounts:
        - name: device-plugins
          mountPath: /var/lib/kubelet/device-plugins
        - name: dev
          mountPath: /dev
      volumes:
      - name: device-plugins
        hostPath:
          path: /var/lib/kubelet/device-plugins
      - name: dev
        hostPath:
          path: /dev
{{- end }}
