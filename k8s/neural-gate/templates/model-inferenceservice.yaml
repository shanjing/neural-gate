{{/*
  This is the main template that renders Helm charts for InferenceService, a special CRD object
  for the KServe Controller to generate low-level K8s objects (Deployment, HPA rules, Services, etc.).
  TODO
  1. add more detailed documentation
  2. add production-grade template
*/}}
{{- range .Values.models }}
{{- $modelName := include "neural-gate.modelName" .name }}
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: {{ $modelName }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "neural-gate.labels" $ | nindent 4 }}
    neural-gate/role: model-server
    neural-gate/model: {{ $modelName }}
spec:
  predictor:
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              neural-gate/role: model-server
          topologyKey: kubernetes.io/hostname
    containers:
    - name: inference-engine
      image: {{ $.Values.engine.image }}
      command:
        {{- toYaml $.Values.engine.command | nindent 8 }}
      args:
        - --model
        - {{ $.Values.volumes.modelsPath }}/{{ .ggufFile }}
        - --ctx-size
        - {{ .contextSize | default $.Values.engine.contextSize | default 4096 | quote }}
        {{- range $.Values.engine.extraArgs }}
        - {{ . | quote }}
        {{- end }}
      ports:
      - name: http
        containerPort: 8080
        protocol: TCP
      resources:
        requests:
          cpu: {{ with index . "cpu" }}{{ .request | default "2" | quote }}{{ else }}"2"{{ end }}
          memory: {{ with index . "memory" }}{{ .request | default "4Gi" }}{{ else }}4Gi{{ end }}
        limits:
          cpu: {{ with index . "cpu" }}{{ .limit | default "4" | quote }}{{ else }}"4"{{ end }}
          memory: {{ with index . "memory" }}{{ .limit | default "8Gi" }}{{ else }}8Gi{{ end }}
          {{ $.Values.engine.gpu.resource }}: {{ $.Values.engine.gpu.count }}
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 30
        periodSeconds: 10
      volumeMounts:
      - name: models
        mountPath: {{ $.Values.volumes.modelsPath }}
    volumes:
    - name: models
      {{- if eq $.Values.volumes.type "hostPath" }}
      hostPath:
        path: {{ $.Values.volumes.modelsPath }}
      {{- else }}
      persistentVolumeClaim:
        claimName: model-weights
      {{- end }}
{{- end }}
