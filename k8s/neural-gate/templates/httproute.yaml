{{- if and .Values.gateway.enabled .Values.models }}
{{- range .Values.models }}
{{- $modelName := include "neural-gate.modelName" .name }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $modelName }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "neural-gate.labels" $ | nindent 4 }}
    neural-gate/model: {{ $modelName }}
spec:
  parentRefs:
  - name: inference-gateway
    namespace: {{ $.Values.namespace }}
  hostnames:
  - {{ $modelName }}.{{ $.Values.gateway.hostname }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ""
      kind: Service
      name: {{ $modelName }}-predictor
      namespace: {{ $.Values.namespace }}
      port: 80
{{- end }}
{{- end }}
